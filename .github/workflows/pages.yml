name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare lightweight site artifact
        shell: bash
        run: |
          mkdir -p dist/ref
          cp index.html styles.css script.js dist/
          cp "ref/CV_Matthew Wong (15).pdf" dist/ref/
          cp ref/gate24-system-overview.jpg dist/ref/
          cp "ref/ChatGPT 圖像 2026年11月10日 下午11_22_53.jpg" dist/ref/
          cp "ref/ChatGPT 圖像 2026年11月10日 下午11_23_49.jpg" dist/ref/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
